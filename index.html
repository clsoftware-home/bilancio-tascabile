<style>
:root{
  --bg:#EEF1EF;--surface:#FFFFFF;--sunk:#E3E8E5;--line:#CCD5D0;
  --ink:#16201C;--muted:#5B6A63;
  --accent:#0E5A52;--accent-ink:#FFFFFF;--accent-soft:#D6E8E4;

}
@media (prefers-color-scheme:dark){:root{
  --bg:#111715;--surface:#19211E;--sunk:#202A26;--line:#2F3B36;--ink:#E6EDEA;--muted:#93A39C;
  --accent:#5FC0B2;--accent-ink:#0B1714;--accent-soft:#1D3833;
  --warn:#F0995A;--warn-soft:#3B2A1E;--good:#7ACB89;--good-soft:#1C3322;--bad:#F2867D;--bad-soft:#3D1F1C;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-b);-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.wrap{max-width:560px;margin:0 auto;padding:18px 18px 28px;display:flex;flex-direction:column;gap:14px;min-height:100vh}
h1{font:800 22px/1.1 var(--f-d);margin:0;letter-spacing:-.01em;white-space:nowrap}h1 span{color:var(--accent)}
h2{font:800 21px var(--f-d);margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hdr{display:flex;align-items:center;gap:10px}
.back{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:22px;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--f-b);padding:5px 10px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}.pill.no{background:var(--warn-soft);color:var(--warn)}
.pill .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.muted{color:var(--muted)}.small{font-size:12.5px}
.label{font:600 11px var(--f-b);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{display:flex;flex-direction:column;gap:6px;border-radius:16px;padding:20px;text-align:left;cursor:pointer;font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.big.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.big .t{display:flex;align-items:center;gap:12px;font:700 20px var(--f-d)}
.big .s{font-size:13.5px;opacity:.85}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .l{display:flex;flex-direction:column;gap:2px;min-width:0}
.row .l b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font:600 11px var(--f-b);padding:2px 8px;border-radius:99px;white-space:nowrap}
.st.q{background:var(--warn-soft);color:var(--warn)}.st.s{background:var(--good-soft);color:var(--good)}.st.a{background:var(--accent-soft);color:var(--accent)}.st.e{background:var(--bad-soft);color:var(--bad)}
.btn{font:600 15px var(--f-b);border-radius:12px;padding:0 16px;min-height:50px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big2{min-height:56px;font:700 17px var(--f-d);width:100%}
.btn.link{border:0;background:transparent;color:var(--accent);min-height:36px;padding:0}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}

input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
input.mono{font-family:var(--f-m);font-size:14px}

.box{background:var(--accent-soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.box .p{font:500 11.5px/1.45 var(--f-m);word-break:break-word}

.notice.w{background:var(--warn-soft);color:var(--warn)}.notice.i{background:var(--accent-soft);color:var(--accent)}.notice.e{background:var(--bad-soft);color:var(--bad)}
.sugg{display:flex;flex-direction:column;gap:6px}
.sugg button{font:inherit;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:11px 12px;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
.sugg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.spacer{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:50;max-width:calc(100% - 32px);text-align:center}
.busy{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
/* editor scansione */
.ed{position:fixed;inset:0;background:#0B0F0E;z-index:40;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.ed .stage{flex:1;position:relative;overflow:hidden;touch-action:none}
.ed canvas{position:absolute;left:0;top:0}
.ed .bar{display:flex;flex-direction:column;gap:10px;padding:12px 16px 16px;background:#141A18;color:#E6EDEA}
.ed .modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ed .modes button{font:600 14px var(--f-b);border-radius:10px;border:1px solid #33403B;background:transparent;color:#E6EDEA;min-height:42px;cursor:pointer}
.ed .modes button[aria-pressed="true"]{background:#5FC0B2;color:#0B1714;border-color:#5FC0B2}
.ed .acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ed .acts .btn{background:#1F2825;color:#E6EDEA;border-color:#33403B}
.ed .acts .btn.primary{background:#5FC0B2;color:#0B1714;border-color:#5FC0B2}
.ed .hint{font-size:12.5px;color:#93A39C;text-align:center}
[hidden]{display:none!important}
</style>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>

<script>
"use strict";
/* ================= configurazione ================= */
const APP_KEY = "g4aukgoayqmqadx";
const REDIRECT = location.origin + location.pathname.replace(/index\.html$/, "");
const INBOX = "/in arrivo";
const TESS_URL = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

const MESI = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
const STATI = ["Non pagato","Primo pagamento","Secondo pagamento","Pagato interamente","Rimandato"];
const CARTELLE_BASE = ["Abbonamento giornali","Assicurazioni","Assura","Automobile e multe","Banca e Prestiti","Carte di Credito e pagam. a rate","Cittadinanza (Documenti Svizzeri)","Classor Fogli Scansionati","Comune di Chiasso","Contabilità","Conto Postale","Curriculum e Lettera Nuovi","Documenti AI e del Cantone Ticino","Documenti di ATTI DI MORTE","Documenti Misti","Documenti Vari","Dottori  e Farmacie","Fatture da email","Generale Ass. Vita","Interfida","Interfida + AGE","Lavoro + Contributi AVS","Lavoro ditte edili","Lettere e curriculum","Per Ufficio","ProInfirmis","SwissLife","Tassazioni","Telefoneria Cellulare e serafe"];
/* parole chiave → cartella (il punteggio impara dalle scelte) */
const PAROLE = {
  "Assicurazioni":["polizza","assicurazione","assicurazioni","sinistro","premio","versicherung","mobiliare","axa","helvetia","allianz","baloise","vaudoise","zurich","responsabilità civile","economia domestica"],
  "Assura":["assura","cassa malati","lamal","conteggio prestazioni","partecipazione ai costi","franchigia","assicurazione malattie"],
  "Automobile e multe":["veicolo","targa","multa","contravvenzione","sezione della circolazione","collaudo","licenza di circolazione","garage","parcheggio","radar"],
  "Banca e Prestiti":["banca","prestito","estratto conto","ubs","raiffeisen","bancastato","credit suisse","tasso d'interesse","ipoteca","credito privato"],
  "Carte di Credito e pagam. a rate":["carta di credito","mastercard","visa","rata","rate","klarna","powerpay","cembra","paycard","acquisto a rate","fattura mensile"],
  "Comune di Chiasso":["comune di chiasso","municipio","cancelleria comunale","città di chiasso","chiasso"],
  "Conto Postale":["postfinance","conto postale","posta ch"],
  "Dottori  e Farmacie":["dottor","dott.","dr.","medico","farmacia","ricetta","ospedale","clinica","studio medico","fisioterapia","dentista","laboratorio"],
  "Tassazioni":["imposta","tassazione","notifica di tassazione","dichiarazione d'imposta","ufficio circondariale","divisione delle contribuzioni","conguaglio","imposte"],
  "Telefoneria Cellulare e serafe":["swisscom","salt","sunrise","serafe","abbonamento mobile","fibra ottica","canone radio"],
  "Lavoro + Contributi AVS":["avs","contributi","salario","cassa di compensazione","certificato di salario","busta paga","datore di lavoro"],
  "Documenti AI e del Cantone Ticino":["assicurazione invalidità","ufficio ai","repubblica e cantone ticino","cantone ticino","istituto delle assicurazioni sociali"],
  "Generale Ass. Vita":["generali","assicurazione vita","previdenza"],
  "SwissLife":["swiss life","swisslife"],
  "Interfida + AGE":["interfida","age sa"],
  "ProInfirmis":["pro infirmis","proinfirmis"],
  "Cittadinanza (Documenti Svizzeri)":["cittadinanza","naturalizzazione","passaporto","carta d'identità","permesso di dimora","stato civile"],
  "Abbonamento giornali":["corriere del ticino","laregione","la regione","giornale","abbonamento al quotidiano","informatore"]
};
const TIPI_DOC = ["Polizza","Fattura","Conteggio prestazioni","Notifica di tassazione","Estratto conto","Contratto","Lettera","Certificato","Ricetta","Conferma","Disdetta","Richiamo","Decisione","Offerta"];

/* ================= utilità ================= */
const $ = s => document.querySelector(s);
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
const pad = n => String(n).padStart(2, "0");
const oggi = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const meseCorr = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1); };
const dIT = s => s ? s.split("-").reverse().join(".") : "";
const itToIso = s => { const m = String(s || "").trim().match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})$/); if (!m) return ""; let y = +m[3]; if (y < 100) y += 2000; return y + "-" + pad(+m[2]) + "-" + pad(+m[1]); };
const fmtAmt = n => (Number(n) || 0).toFixed(2);
const parseAmt = s => { const n = parseFloat(String(s || "").replace(/['’\s]/g, "").replace(",", ".")); return isFinite(n) ? Math.round(n * 100) / 100 : NaN; };
const uid = () => new Date().toISOString().replace(/[-:T.Z]/g, "").slice(0, 14) + "-" + Math.random().toString(36).slice(2, 7);
function toast(msg, ms = 2800) { const t = h("div", { class: "toast", role: "status", text: msg }); $("#toast").replaceChildren(t); setTimeout(() => t.remove(), ms); }
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("load " + src)); document.head.append(s); }); }

/* formattazione riferimento QR (27 cifre: 2 + 5×5) */
function fmtRif(r) {
  r = String(r || "").replace(/\s+/g, "");
  if (/^\d{27}$/.test(r)) return r.slice(0, 2) + " " + r.slice(2).match(/.{5}/g).join(" ");
  if (/^RF/i.test(r)) return r.toUpperCase().match(/.{1,4}/g).join(" ");
  return r;
}
const fmtIban = s => String(s || "").replace(/\s+/g, "").toUpperCase().replace(/(.{4})/g, "$1 ").trim();

/* ================= QR-fattura svizzera ================= */
function parseQRBill(text) {
  if (!text) return null;
  const L = text.replace(/\r/g, "").split("\n");
  if (L[0] !== "SPC") return null;
  const g = i => (L[i] || "").trim();
  const nome = g(5);
  const r = { iban: g(3), beneficiario: nome, importo: g(18) ? parseFloat(g(18)) : null, valuta: g(19), tipoRif: g(27), riferimento: g(28), messaggio: g(29) };
  return r.iban ? r : null;
}
function scanQR(canvas) {
  if (!window.jsQR) return null;
  const tries = [];
  const W = canvas.width, H = canvas.height;
  const scale = Math.min(1, 1600 / Math.max(W, H));
  tries.push([0, 0, W, H, scale]);
  tries.push([0, H * 0.45, W, H * 0.55, Math.min(1, 1400 / W)]); /* parte di pagamento in basso */
  tries.push([0, 0, W, H, Math.min(1, 900 / Math.max(W, H))]);
  for (const [sx, sy, sw, sh, sc] of tries) {
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(sw * sc)); c.height = Math.max(1, Math.round(sh * sc));
    const x = c.getContext("2d", { willReadFrequently: true });
    x.drawImage(canvas, sx, sy, sw, sh, 0, 0, c.width, c.height);
    const d = x.getImageData(0, 0, c.width, c.height);
    const q = jsQR(d.data, c.width, c.height, { inversionAttempts: "attemptBoth" });
    if (q && q.data) { const p = parseQRBill(q.data); if (p) return p; }
  }
  return null;
}

/* ================= analisi del testo (OCR) ================= */
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function trovaDate(t) {
  const out = [];
  const re = /\b(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})\b/g; let m;
  while ((m = re.exec(t))) { const iso = itToIso(m[0]); if (iso) out.push({ iso, idx: m.index }); }
  const mesi = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
  const re2 = new RegExp("\\b(\\d{1,2})\\.?\\s+(" + mesi.join("|") + ")\\s+(\\d{4})\\b", "gi");
  while ((m = re2.exec(t))) out.push({ iso: m[3] + "-" + pad(mesi.indexOf(m[2].toLowerCase()) + 1) + "-" + pad(+m[1]), idx: m.index });
  const max = oggi(), min = (new Date().getFullYear() - 30) + "-01-01";
  return out.filter(d => d.iso <= "2100" && d.iso >= min && !isNaN(new Date(d.iso)));
}
function dataDocumento(t) {
  const ds = trovaDate(t).filter(d => d.iso <= oggi());
  if (!ds.length) return "";
  return ds.sort((a, b) => a.idx - b.idx)[0].iso; /* di solito la prima data in alto è quella della lettera */
}
function scadenzaDa(t) {
  const n = norm(t);
  const m = n.match(/(scadenza|pagabile entro|da pagare entro|entro il|zahlbar bis|faellig|echeance|payable jusqu)[^0-9]{0,25}(\d{1,2}[.\/]\d{1,2}[.\/]\d{2,4})/);
  return m ? itToIso(m[2]) : "";
}
function importoDa(t) {
  const m = t.replace(/'/g, "").match(/(?:CHF|Fr\.)\s*([0-9]{1,6}[.,][0-9]{2})/i) || t.replace(/'/g, "").match(/([0-9]{1,6}[.,][0-9]{2})\s*(?:CHF)/i);
  return m ? parseAmt(m[1]) : NaN;
}
function ibanDa(t) { const m = t.replace(/\s+/g, "").match(/CH\d{2}[0-9A-Z]{17}/i); return m ? m[0].toUpperCase() : ""; }
function rifDa(t) { const m = t.match(/\b(\d{2}(?:\s?\d{5}){5})\b/); return m ? m[1].replace(/\s/g, "") : ""; }

function proponiCartelle(testo, cartelle) {
  const n = norm(testo);
  const learn = ls.get("bt_learn", {});
  const words = new Set((n.match(/[a-z]{5,}/g) || []));
  const sc = {};
  for (const c of cartelle) {
    let s = 0;
    for (const k of (PAROLE[c] || [])) if (n.includes(norm(k))) s += k.length > 8 ? 3 : 2;
    if (n.includes(norm(c.replace(/\(.*?\)/g, "").trim()))) s += 3;
    const L = learn[c] || {};
    for (const w of words) if (L[w]) s += Math.min(3, L[w] * 0.6);
    sc[c] = s;
  }
  const ord = cartelle.slice().sort((a, b) => sc[b] - sc[a]);
  const top = ord.filter(c => sc[c] > 0).slice(0, 3);
  if (top.length < 3) for (const c of ["Documenti Vari", "Documenti Misti", "Assicurazioni"]) if (!top.includes(c) && cartelle.includes(c) && top.length < 3) top.push(c);
  return { top, sc };
}
function impara(testo, cartella) {
  if (!testo) return;
  const learn = ls.get("bt_learn", {});
  const stop = new Set(["della","delle","degli","sono","questa","questo","nostro","vostro","grazie","saluti","signor","signora","pagina","totale","importo","data","indirizzo","telefono","email","presente","quale","nella","nelle","anche","vostra","nostra","dalla","dalle"]);
  const words = [...new Set((norm(testo).match(/[a-z]{5,}/g) || []))].filter(w => !stop.has(w)).slice(0, 60);
  const L = learn[cartella] || (learn[cartella] = {});
  for (const w of words) L[w] = Math.min(20, (L[w] || 0) + 1);
  ls.set("bt_learn", learn);
}
function descrizioneDa(testo, cartella) {
  const n = norm(testo);
  let tipo = TIPI_DOC.find(t => n.includes(norm(t))) || "";
  let ente = "";
  const generici = /^(polizza|rata|rate|assicurazione|assicurazioni|imposta|imposte|tassazione|banca|contributi|salario|veicolo|targa|multa|medico|farmacia|ricetta|premio|sinistro|giornale)$/i;

const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

/* ================= invio ================= */
let sending = false;
async function invia() {
  if (sending || !navigator.onLine || !Dbx.connected) return;
  sending = true;
  try {
    const items = (await DB.all()).filter(i => i.stato === "coda" || i.stato === "errore");
    for (const it of items) {
      try {
        await Dbx.upload(INBOX + "/" + it.id + ".pdf", it.pdf);
        await Dbx.upload(INBOX + "/" + it.id + ".json", new Blob([JSON.stringify(it.meta, null, 2)], { type: "application/json" }));
        it.stato = "inviato"; it.inviatoIl = new Date().toISOString(); delete it.err;
        it.pdf = null; /* il PDF non serve più sul telefono */
        await DB.put(it);
      } catch (e) { it.stato = "errore"; it.err = String(e.message || e); await DB.put(it); }
    }
    /* chi non è più in "in arrivo" è stato archiviato dal PC */
    const sent = (await DB.all()).filter(i => i.stato === "inviato");
    if (sent.length) { const ids = await Dbx.inboxIds(); for (const it of sent) if (!ids.has(it.id)) { it.stato = "archiviato"; await DB.put(it); } }
    /* elenco cartelle aggiornato dal PC */
    const cj = await Dbx.download("/config/cartelle.json").catch(() => null);
    if (cj) { try { const a = JSON.parse(cj); if (Array.isArray(a.cartelle) && a.cartelle.length) ls.set("bt_cartelle", a.cartelle); } catch {} }
    /* tieni solo gli ultimi 60 */
    const all = (await DB.all()).sort((a, b) => b.creato.localeCompare(a.creato));
    for (const it of all.slice(60)) if (it.stato === "archiviato") await DB.del(it.id);
  } catch (e) { console.warn(e); }
  finally { sending = false; if (S.view === "home" || S.view === "coda") render(); }
}
